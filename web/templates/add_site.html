<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add site — SitePulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
          rel="stylesheet">
    <style>
        :root {
            --bg: #0b1120;
            --surface: #121a2e;
            --border: #26314d;
            --text: #e7ecf6;
            --text-dim: #8493b0;
            --text-faint: #5c6987;
            --blue: #5c9dff;
            --blue-dim: rgba(92, 157, 255, 0.12);
            --red: #f1685e;
            --red-dim: rgba(241, 104, 94, 0.12);
            --radius: 10px;
            --sans: 'Inter', system-ui, -apple-system, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--sans);
            background: radial-gradient(ellipse 800px 400px at 80% -10%, rgba(92, 157, 255, 0.08), transparent),
            var(--bg);
            color: var(--text);
            margin: 0;
            padding: 32px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 32px;
        }

        .eyebrow {
            font-family: var(--mono);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 8px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .subtext {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin: 0 0 24px;
            line-height: 1.5;
        }

        .error-banner {
            background: var(--red-dim);
            border: 1px solid rgba(241, 104, 94, 0.35);
            color: #ffb4ae;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.88rem;
        }

        .error-banner strong {
            color: var(--red);
            font-family: var(--mono);
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        input[type="url"] {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.15s ease;
        }

        input[type="url"]::placeholder {
            color: var(--text-faint);
        }

        input[type="url"]:focus {
            border-color: var(--blue);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: filter 0.15s ease, background 0.15s ease;
        }

        .btn:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 2px;
        }

        .btn-primary {
            background: var(--blue);
            color: #061022;
        }

        .btn-primary:hover {
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text);
        }
    </style>
</head>
<body>
<div class="card">
    <div class="eyebrow">New target</div>
    <h1>Add a site to watch</h1>
    <p class="subtext">SitePulse will start checking status, SSL, and links on the next scheduled run.</p>

    {% if error %}
    <div class="error-banner">
        <strong>Couldn't add site —</strong> {{ error }}
    </div>
    {% endif %}

    <form action="/add-site" method="POST">
        <label for="url">Website URL</label>
        <input type="url" id="url" name="url" placeholder="https://example.com" required autofocus>

        <div class="actions">
            <button type="submit" class="btn btn-primary">Add site</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>

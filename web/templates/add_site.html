<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
          rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='logo.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', path='logo.ico') }}">
    <script src="https://unpkg.com/@hotwired/turbo@8.0.4/dist/turbo.es2017-umd.js"></script>
    <link rel="stylesheet" href="/static/app.css">
</head>

<body class="page-addsite">
<div class="card">
    <div class="eyebrow"><span class="dot" aria-hidden="true"></span>New target</div>
    <h1 class="heading-addsite">Add a site to watch</h1>
    <p class="subtext">SitePulse will start checking status, SSL, and links on the next scheduled run.</p>

    {% if error %}
    <div class="error-banner-addsite">
        <strong>Couldn't add site —</strong> {{ error }}
    </div>
    {% endif %}

    <form action="/add-site" method="POST" data-turbo="false" id="add-site-form">
        <label for="url">Website URL</label>
        <div class="input-wrap">
            <input type="text" id="url" name="url" placeholder="https://example.com" required autofocus>
        </div>

        <div class="actions">
            <button type="submit" class="btn-addsite btn-primary">Add site</button>
            <a href="/" class="btn-addsite btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
